# docker-compose.yml (en la raíz del proyecto)
version: '3.8'
services:
  # Servicio del Backend (API)
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mydb

      # ---rellenar con estas cuatro lineas ---

    depends_on:
      - postgres_db
    volumes:
      - ./server:/app
      - /app/node_modules

  # Servicio de la Base de Datos
  postgres_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: