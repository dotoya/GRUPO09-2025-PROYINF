# docker-compose.yml (en la raíz del proyecto)
version: '3.8'
services:
  # Servicio del Backend (API)
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT}

      # ---rellenar con estas cuatro lineas ---
      - AZURE_DOC_KEY=${AZURE_DOC_KEY}
      - AZURE_DOC_ENDPOINT=${AZURE_DOC_ENDPOINT}
      - AZURE_FACE_KEY=${AZURE_FACE_KEY}
      - AZURE_FACE_ENDPOINT=${AZURE_FACE_ENDPOINT}

    depends_on:
      postgres_db:
          condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

      # Se añade frontend React/Vite como servicio docker

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Puerto típico de Vite/React
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001

  # Servicio de la Base de Datos
  postgres_db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    

volumes:
  postgres_data: