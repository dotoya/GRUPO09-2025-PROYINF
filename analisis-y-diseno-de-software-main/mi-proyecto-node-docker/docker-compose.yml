# docker-compose.yml (en la raíz del proyecto)
version: '3.8'
services:
  # Servicio del Backend (API)
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mydb

      # ---rellenar con estas cuatro lineas ---
    depends_on:
      postgres_db:
          condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

      # Se añade frontend React/Vite como servicio docker

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Puerto típico de Vite/React
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001

  # Servicio de la Base de Datos
  postgres_db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    

volumes:
  postgres_data: